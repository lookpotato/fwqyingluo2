version: "3.8"

services:
  fwqyingluo2:
    build: .
    container_name: fwqyingluo2
    restart: always
    ports:
      - "8000:8000"
    environment:
      - PERSONALITY_ID=default_robot
      - AUDIO_OUTPUT_DIR=/app/audio_outputs
      - MEMORY_DB_PATH=/app/data/memory.sqlite
      - DEEPSEEK_API_KEY=${DEEPSEEK_API_KEY:-}
      - DEEPSEEK_BASE_URL=${DEEPSEEK_BASE_URL:-https://api.deepseek.com}
      - DEEPSEEK_MODEL=${DEEPSEEK_MODEL:-deepseek-v4-pro}
      - DEEPSEEK_REASONING_EFFORT=${DEEPSEEK_REASONING_EFFORT:-high}
      - DEEPSEEK_THINKING_ENABLED=${DEEPSEEK_THINKING_ENABLED:-true}
      - TTS_PROVIDER=${TTS_PROVIDER:-edge}
      - TTS_CONNECT_TIMEOUT_SECONDS=${TTS_CONNECT_TIMEOUT_SECONDS:-5}
      - TTS_READ_TIMEOUT_SECONDS=${TTS_READ_TIMEOUT_SECONDS:-15}
      - TTS_LANGUAGE=${TTS_LANGUAGE:-zh-CN}
      - TTS_VOICE=${TTS_VOICE:-zh-CN-XiaoxiaoNeural}
      - TTS_RATE=${TTS_RATE:-+0%}
      - STT_PROVIDER=${STT_PROVIDER:-vosk}
      - VOSK_MODEL_DIR=${VOSK_MODEL_DIR:-/app/models/vosk-model-small-cn-0.22}
      - SHERPA_MODEL_DIR=${SHERPA_MODEL_DIR:-/app/models/sherpa-onnx-streaming-zipformer-ctc-zh-int8-2025-06-30}
      - SHERPA_NUM_THREADS=${SHERPA_NUM_THREADS:-2}
      - SHERPA_PROVIDER=${SHERPA_PROVIDER:-cpu}
    volumes:
      - ./data:/app/data
      - ./audio_outputs:/app/audio_outputs
      - ./models:/app/models
